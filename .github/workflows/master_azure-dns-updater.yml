# Builds the function and deploys it to Azure Functions.
# Pushes to master deploy prod; a manual run deploys the environment you pick (dev by default).
# The job runs in the GitHub environment of that name and takes its secrets and the app name from there.
# Authenticates with OpenID Connect, see "Deployment with GitHub Actions" in README.md for the required setup.

name: Deploy to Azure Functions

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    # Push events have no inputs, so they fall back to prod.
    name: Deploy (${{ inputs.environment || 'prod' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'prod' }}
    concurrency:
      group: app-${{ inputs.environment || 'prod' }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment || 'prod' }}
      AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
    steps:
      - name: Check configuration
        shell: bash
        run: |
          if [ -z "$AZURE_FUNCTIONAPP_NAME" ]; then
            echo "::error::Set the variable AZURE_FUNCTIONAPP_NAME in the $ENVIRONMENT environment to the functionAppName output of the infrastructure deployment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish function
        run: dotnet publish DNSUpdater.Function/DNSUpdater.Function.csproj --configuration Release --output ./output

      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./output
